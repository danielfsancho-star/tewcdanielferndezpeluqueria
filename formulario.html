<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservar cita - Azur Peluquería</title>

    <link rel="icon" href="img/logo.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--CSS -->
    <link href="css/design.css" rel="stylesheet">
</head>
<body>

<!-- navbar -->
<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <img src="img/logo.png" height="40" class="me-2" alt="Logo">
            Azur Peluquería
        </a>
    </div>
</nav>

<main class="container" style="margin-top: 6rem; max-width: 700px;">

    <!-- titulo -->
    <h1 class="mb-4 text-center">Reservar cita</h1>

    <!-- imagen-->
    <div class="text-center mb-4">
        <img src="img/formulario.jpg" class="img-fluid imagen-formulario" alt="Imagen peluquería">
    </div>

    <!-- formulario -->
    <form action="resultado.html" method="get">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="tel" name="telefono" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Servicio</label>
            <select name="servicio" class="form-select">
                <option>Corte y peinado</option>
                <option>Coloración</option>
                <option>Arreglo barba</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha preferida</label>
            <input type="date" name="fecha" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea name="mensaje" class="form-control" rows="3"></textarea>
        </div>
        <!-- Boton -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg">
                Enviar solicitud
            </button>
        </div>

    </form>

</main>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
